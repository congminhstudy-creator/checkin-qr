<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check-in Sự Kiện Multi-Sheet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    #reader video { object-fit: cover !important; border-radius: 0.75rem; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen font-sans pb-10">

  <!-- Header & Dashboard -->
  <div class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-10">
    <div class="flex justify-between items-center max-w-md mx-auto mb-2">
      <h1 class="text-lg font-bold">CHECK-IN SỰ KIỆN</h1>
      <button onclick="toggleConfig()" class="text-xs bg-indigo-700 hover:bg-indigo-800 px-2.5 py-1 rounded-md border border-indigo-500">
        ⚙️ Cấu hình File
      </button>
    </div>

    <!-- Khung Cấu hình File Google Sheet -->
    <div id="config-box" class="bg-indigo-800/80 backdrop-blur p-3 rounded-lg max-w-md mx-auto mb-3 text-xs space-y-2 hidden">
      <div>
        <label class="block text-indigo-200 mb-1">Link hoặc ID Google Sheet:</label>
        <input type="text" id="sheet-input" placeholder="Dán URL Google Sheet tại đây..." class="w-full bg-indigo-900/90 text-white px-2.5 py-1.5 rounded border border-indigo-500 focus:outline-none text-xs">
      </div>
      <div class="flex gap-2">
        <div class="flex-1">
          <label class="block text-indigo-200 mb-1">Tên Tab Trang tính:</label>
          <input type="text" id="sheet-name" value="DanhSachKhach" class="w-full bg-indigo-900/90 text-white px-2.5 py-1.5 rounded border border-indigo-500 focus:outline-none text-xs">
        </div>
        <div class="flex items-end">
          <button onclick="connectSheet()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold px-3 py-1.5 rounded text-xs transition">
            Kết nối
          </button>
        </div>
      </div>
      <div id="config-status" class="text-amber-200 text-[11px] font-medium"></div>
    </div>

    <!-- Thống kê -->
    <div class="grid grid-cols-3 gap-2 max-w-md mx-auto text-center">
      <div class="bg-indigo-700/60 p-2 rounded-lg">
        <div class="text-[10px] text-indigo-200">Tổng khách</div>
        <div id="stat-total" class="text-base font-bold">--</div>
      </div>
      <div class="bg-emerald-600/80 p-2 rounded-lg">
        <div class="text-[10px] text-emerald-100">Đã đến</div>
        <div id="stat-checked" class="text-base font-bold">--</div>
      </div>
      <div class="bg-amber-600/80 p-2 rounded-lg">
        <div class="text-[10px] text-amber-100">Còn lại</div>
        <div id="stat-remain" class="text-base font-bold">--</div>
      </div>
    </div>
  </div>

  <div class="max-w-md mx-auto p-4 space-y-4">

    <!-- Khung Quét Camera -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
      <div class="flex justify-between items-center mb-2">
        <span class="font-semibold text-slate-700 text-sm">Camera Quét Mã QR</span>
        <button id="toggle-cam-btn" onclick="toggleCamera()" class="text-xs bg-indigo-50 text-indigo-600 font-medium px-3 py-1.5 rounded-full border border-indigo-200">
          Tắt Camera
        </button>
      </div>
      <div id="reader" class="w-full overflow-hidden bg-slate-900 rounded-lg min-h-[250px] flex items-center justify-center text-slate-400 text-xs"></div>
      
      <!-- Nút Chụp Ảnh QR Dự Phòng -->
      <div class="mt-4 pt-3 border-t border-slate-200 text-center">
        <p class="text-[11px] text-slate-500 mb-2">Nếu không thấy Camera chạy, hãy dùng nút bên dưới:</p>
        <input type="file" id="qr-input-file" accept="image/*" capture="environment" style="display: none;" onchange="scanImage(event)">
        <button type="button" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2.5 px-4 rounded-lg text-sm shadow-sm transition" onclick="document.getElementById('qr-input-file').click()">
          📸 Chụp Ảnh Để Quét QR
        </button>
      </div>
    </div>

    <!-- Tìm kiếm thủ công -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
      <label class="block text-xs font-semibold text-slate-600 mb-1">Tìm thủ công (Mã vé / SĐT / Tên)</label>
      <form onsubmit="handleManualSubmit(event)" class="flex gap-2">
        <input type="text" id="manual-input" placeholder="Nhập tên hoặc SĐT..." class="flex-1 bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <button type="submit" class="bg-indigo-600 text-white font-medium px-4 py-2 rounded-lg text-sm hover:bg-indigo-700 active:scale-95 transition">
          Tìm
        </button>
      </form>
    </div>

  </div>

  <!-- Pop-up Danh Sách Trùng Tên (Multi Match) -->
  <div id="multi-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white w-full max-w-sm rounded-2xl p-5 shadow-2xl max-h-[85vh] flex flex-col">
      <h3 class="text-base font-bold text-slate-800 mb-1">Chọn Khách Hàng Check-in</h3>
      <p id="multi-msg" class="text-xs text-slate-500 mb-3"></p>
      
      <!-- Danh sách cuộn -->
      <div id="multi-list" class="overflow-y-auto space-y-2 flex-1 pr-1 mb-4">
        <!-- Các item được tạo động -->
      </div>

      <button onclick="closeMultiModal()" class="w-full bg-slate-200 text-slate-700 font-medium py-2 rounded-xl text-xs hover:bg-slate-300 transition">
        Đóng / Hủy
      </button>
    </div>
  </div>

  <!-- Pop-up Kết Quả Check-in Chi Tiết -->
  <div id="result-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div id="modal-card" class="bg-white w-full max-w-sm rounded-2xl p-6 text-center shadow-2xl transition-all">
      <div id="modal-icon" class="w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3 text-3xl"></div>
      <h3 id="modal-title" class="text-lg font-bold mb-1"></h3>
      <p id="modal-msg" class="text-xs mb-4 text-slate-500"></p>
      
      <div id="modal-details" class="bg-slate-50 rounded-xl p-3 text-left space-y-1.5 text-sm mb-5 border border-slate-100">
        <div><span class="text-slate-500 text-xs">Họ tên:</span> <span id="res-name" class="font-bold text-slate-800"></span></div>
        <div><span class="text-slate-500 text-xs">Đơn vị:</span> <span id="res-company" class="font-semibold text-indigo-900"></span></div>
        <div><span class="text-slate-500 text-xs">Vị trí ngồi:</span> <span id="res-seat" class="font-bold text-indigo-600"></span></div>
        <div><span class="text-slate-500 text-xs">Mã vé:</span> <span id="res-code" class="font-mono text-xs text-slate-600"></span></div>
      </div>

      <button onclick="closeModal()" class="w-full bg-slate-800 text-white font-medium py-2.5 rounded-xl text-sm hover:bg-slate-900 transition">
        Đóng & Tiếp tục
      </button>
    </div>
  </div>

  <script>
    // URL Deployment từ Google Apps Script của bạn
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzSQQ4f-CuEHRK8bDDgh6cf1c8ZZdJb6GA01f-EU4aD7IMF_NyYo1QlmoIfv0tOo2Yp/exec";
    
    let html5QrCode = null;
    let isProcessing = false;
    let isCameraActive = false;

    function playBeep(type) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'SUCCESS') {
          osc.frequency.setValueAtTime(880, ctx.currentTime);
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          osc.start();
          osc.stop(ctx.currentTime + 0.15);
        } else if (type === 'ALREADY') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(440, ctx.currentTime);
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          osc.start();
          osc.stop(ctx.currentTime + 0.3);
        } else {
          osc.type = 'square';
          osc.frequency.setValueAtTime(220, ctx.currentTime);
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          osc.start();
          osc.stop(ctx.currentTime + 0.4);
        }
      } catch(e) { console.log(e); }
    }

    function toggleConfig() {
      document.getElementById('config-box').classList.toggle('hidden');
    }

    function getSheetInput() {
      return document.getElementById('sheet-input').value.trim();
    }

    function getSheetName() {
      return document.getElementById('sheet-name').value.trim() || 'DanhSachKhach';
    }

    function connectSheet() {
      const statusEl = document.getElementById('config-status');
      const input = getSheetInput();
      const name = getSheetName();

      if (!input) {
        statusEl.innerText = "⚠️ Vui lòng dán Link hoặc ID Google Sheet!";
        statusEl.className = "text-amber-200 text-[11px] font-medium";
        document.getElementById('config-box').classList.remove('hidden');
        return;
      }
      
      statusEl.innerText = "Đang kết nối...";

      fetch(GAS_WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          action: "connect",
          sheetInput: input,
          sheetName: name
        })
      })
      .then(res => res.json())
      .then(res => {
        if (res.status === 'SUCCESS') {
          statusEl.innerText = "✓ Đã kết nối: " + res.title + " (" + res.sheetName + ")";
          statusEl.className = "text-emerald-300 text-[11px] font-medium";
          document.getElementById('stat-total').innerText = res.stats.total;
          document.getElementById('stat-checked').innerText = res.stats.checkedIn;
          document.getElementById('stat-remain').innerText = res.stats.remaining;
          
          localStorage.setItem('saved_sheet_input', input);
          localStorage.setItem('saved_sheet_name', name);
        } else {
          statusEl.innerText = "✕ " + res.message;
          statusEl.className = "text-rose-300 text-[11px] font-medium";
        }
      })
      .catch(err => {
        statusEl.innerText = "✕ Lỗi kết nối API máy chủ!";
        statusEl.className = "text-rose-300 text-[11px] font-medium";
      });
    }

    window.onload = function() {
      const savedInput = localStorage.getItem('saved_sheet_input');
      const savedName = localStorage.getItem('saved_sheet_name');
      if (savedInput) document.getElementById('sheet-input').value = savedInput;
      if (savedName) document.getElementById('sheet-name').value = savedName;

      connectSheet();
      startCamera();
    };

    function startCamera() {
      html5QrCode = new Html5Qrcode("reader");
      const config = { fps: 10, qrbox: { width: 220, height: 220 } };
      
      html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
      .then(() => { isCameraActive = true; })
      .catch(err => {
        document.getElementById('reader').innerHTML = "<div class='p-5 text-center text-rose-500'>Trình duyệt chặn Camera!<br>Vui lòng dùng nút 📸 Chụp Ảnh bên dưới.</div>";
      });
    }

    function toggleCamera() {
      if (isCameraActive) {
        html5QrCode.stop().then(() => {
          isCameraActive = false;
          document.getElementById('toggle-cam-btn').innerText = "Bật Camera";
          document.getElementById('reader').innerText = "Camera đã tắt";
        });
      } else {
        document.getElementById('toggle-cam-btn').innerText = "Tắt Camera";
        startCamera();
      }
    }

    function onScanSuccess(decodedText) {
      if (isProcessing) return;
      processCheckIn(decodedText);
    }
    
    function scanImage(event) {
      if (event.target.files.length === 0) return; 
      
      const imageFile = event.target.files[0];
      const html5QrCode = new Html5Qrcode("reader"); 
      
      html5QrCode.scanFileV2(imageFile, true)
        .then(qrCodeResult => {
            onScanSuccess(qrCodeResult.decodedText); 
            event.target.value = ''; 
        })
        .catch(err => {
            html5QrCode.scanFile(imageFile, false)
              .then(decodedText => {
                onScanSuccess(decodedText);
                event.target.value = '';
              })
              .catch(e => {
                alert("Không nhận diện được mã QR. Vui lòng chụp/chọn ảnh rõ ràng hơn!");
                event.target.value = ''; 
              });
        });
    }

    function handleManualSubmit(e) {
      e.preventDefault();
      const val = document.getElementById('manual-input').value.trim();
      if (val && !isProcessing) {
        processCheckIn(val);
      }
    }

    function processCheckIn(code, exactIndex = null) {
      isProcessing = true;
      const input = getSheetInput();
      const name = getSheetName();
      
      fetch(GAS_WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          action: "checkIn",
          queryCode: code,
          sheetInput: input,
          sheetName: name,
          exactIndex: exactIndex
        })
      })
      .then(res => res.json())
      .then(res => {
        if (res.status === 'MULTIPLE_MATCHES') {
          showMultiModal(res);
        } else {
          closeMultiModal();
          showModal(res);
        }
      })
      .catch(err => {
        closeMultiModal();
        showModal({ status: "ERROR", message: "Lỗi kết nối máy chủ API!" });
      });
    }

    function showMultiModal(res) {
      const modal = document.getElementById('multi-modal');
      const list = document.getElementById('multi-list');
      document.getElementById('multi-msg').innerText = res.message;
      
      list.innerHTML = '';
      
      res.guests.forEach(guest => {
        const item = document.createElement('div');
        const isArrived = guest.status === 'Đã đến';
        
        item.className = `p-3 rounded-xl border text-left flex justify-between items-center transition cursor-pointer ${
          isArrived ? 'bg-slate-50 border-slate-200' : 'bg-indigo-50/50 border-indigo-200 hover:bg-indigo-100'
        }`;
        
        item.onclick = function() {
          processCheckIn(guest.ticketCode, guest.rowIndex);
        };

        item.innerHTML = `
          <div>
            <div class="font-bold text-slate-800 text-sm">${guest.name}</div>
            <div class="text-xs text-slate-500">${guest.company} • SĐT: ${guest.phone}</div>
            <div class="text-[11px] text-indigo-600 font-medium">Chỗ ngồi: ${guest.seat}</div>
          </div>
          <div class="text-right">
            ${isArrived 
              ? `<span class="inline-block px-2 py-0.5 bg-amber-100 text-amber-700 font-bold text-[10px] rounded-md">Đã đến (${guest.time})</span>` 
              : `<span class="inline-block px-2.5 py-1 bg-indigo-600 text-white font-semibold text-xs rounded-lg shadow-sm">Check-in</span>`
            }
          </div>
        `;
        
        list.appendChild(item);
      });

      modal.classList.remove('hidden');
    }

    function closeMultiModal() {
      document.getElementById('multi-modal').classList.add('hidden');
      isProcessing = false;
    }

    let autoCloseTimer = null;
    function showModal(res) {
      const modal = document.getElementById('result-modal');
      const icon = document.getElementById('modal-icon');
      const title = document.getElementById('modal-title');
      const msg = document.getElementById('modal-msg');
      const details = document.getElementById('modal-details');

      playBeep(res.status);

      if (res.status === 'SUCCESS') {
        icon.className = "w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3 text-3xl bg-emerald-100 text-emerald-600";
        icon.innerHTML = "✓";
        title.innerText = "CHECK-IN THÀNH CÔNG";
        title.className = "text-lg font-bold mb-1 text-emerald-600";
        details.classList.remove('hidden');
        
        document.getElementById('res-name').innerText = res.name || "--";
        document.getElementById('res-company').innerText = res.company || "--";
        document.getElementById('res-seat').innerText = res.seat || "--";
        document.getElementById('res-code').innerText = res.ticketCode || "--";
        
        if(res.stats) {
          document.getElementById('stat-total').innerText = res.stats.total;
          document.getElementById('stat-checked').innerText = res.stats.checkedIn;
          document.getElementById('stat-remain').innerText = res.stats.remaining;
        }
      } else if (res.status === 'ALREADY') {
        icon.className = "w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3 text-3xl bg-amber-100 text-amber-600";
        icon.innerHTML = "!";
        title.innerText = "CẢNH BÁO: ĐÃ CHECK-IN";
        title.className = "text-lg font-bold mb-1 text-amber-600";
        details.classList.remove('hidden');
        
        document.getElementById('res-name').innerText = res.name || "--";
        document.getElementById('res-company').innerText = res.company || "--";
        document.getElementById('res-seat').innerText = res.seat || "--";
        document.getElementById('res-code').innerText = (res.ticketCode || "") + " (" + (res.time || "") + ")";
      } else {
        icon.className = "w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3 text-3xl bg-rose-100 text-rose-600";
        icon.innerHTML = "✕";
        title.innerText = "LỖI CHECK-IN";
        title.className = "text-lg font-bold mb-1 text-rose-600";
        details.classList.add('hidden');
      }

      msg.innerText = res.message;
      modal.classList.remove('hidden');

      clearTimeout(autoCloseTimer);
      autoCloseTimer = setTimeout(closeModal, 2500);
    }

    function closeModal() {
      document.getElementById('result-modal').classList.add('hidden');
      clearTimeout(autoCloseTimer);
      isProcessing = false;
      document.getElementById('manual-input').value = '';
    }
  </script>
</body>
</html>
